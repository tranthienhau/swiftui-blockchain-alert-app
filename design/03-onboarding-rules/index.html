<!DOCTYPE html>

        .soft-shadow {
            box-shadow: 0 2px 12px rgba(15,23,42,0.06);
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-text-primary min-h-screen flex flex-col items-center justify-center font-body-md overflow-hidden relative">
<!-- Mobile Canvas Container -->
<main class="w-full max-w-[390px] h-full min-h-[844px] bg-background relative flex flex-col justify-between overflow-y-auto overflow-x-hidden shadow-2xl sm:border border-border">
<!-- Top Section -->
<div class="flex-1 flex flex-col px-screen-padding pt-12 pb-6 relative z-10">
<!-- Illustration Area -->
<div class="w-full aspect-[4/3] rounded-2xl bg-surface-container-low mb-8 relative flex items-center justify-center overflow-hidden border border-border">
<!-- Abstract Illustration Elements representing 'Rule Builder' -->
<div class="absolute inset-0 bg-gradient-to-br from-surface-container-low to-surface opacity-50"></div>
<div class="w-48 h-auto flex flex-col gap-3 relative z-10">
<!-- Fake Rule Block 1 -->
<div class="bg-surface rounded-lg p-3 soft-shadow border border-border/50 transform -rotate-2 -translate-x-4 flex items-center gap-2">
<div class="w-6 h-6 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] text-primary" style="font-variation-settings: 'FILL' 1;">compare_arrows</span>
</div>
<div class="flex-1">
<div class="h-2 w-16 bg-surface-container-high rounded mb-1"></div>
<div class="h-1.5 w-10 bg-surface-container-high rounded"></div>
</div>
</div>
<!-- Connection Line -->
<div class="w-full flex justify-center">
<div class="w-0.5 h-4 bg-primary/30"></div>
</div>
<!-- Fake Rule Block 2 (Action) -->
<div class="bg-surface rounded-lg p-3 soft-shadow border border-primary/20 transform translate-x-2 flex items-center gap-2 relative overflow-hidden">
<div class="absolute inset-0 bg-primary/5"></div>
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center relative z-10">
<span class="material-symbols-outlined text-[14px] text-on-primary" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
</div>
<div class="flex-1 relative z-10">
<div class="h-2 w-20 bg-primary/40 rounded mb-1"></div>
</div>
</div>
</div>
</div>
<!-- Typography -->
<h1 class="font-headline-lg text-headline-lg text-text-primary mb-4 tracking-tight">Set your own alert rules</h1>
<p class="font-body-md text-body-md text-text-secondary mb-8">Create powerful, custom triggers based on on-chain events that matter to you.</p>
<!-- Example Rule Card -->
<div class="bg-surface rounded-xl p-4 soft-shadow mb-6 border border-border">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center border border-border">
<span class="material-symbols-outlined text-text-secondary" style="font-variation-settings: 'FILL' 1;">currency_exchange</span>
</div>
<div>
<p class="font-card-title text-card-title text-text-primary">Transfer Volume</p>
<p class="font-caption text-caption text-text-secondary">Any ERC-20 token</p>
</div>
</div>
<div class="bg-[#D9F5EA] text-[#0E9F6E] px-3 py-1.5 rounded-full font-numeral-data text-numeral-data">
                        &gt; $50,000
                    </div>
</div>
</div>
<!-- Presets Section -->
<p class="font-caption text-caption text-text-secondary mb-3 uppercase tracking-wider">Quick Presets</p>
<div class="flex flex-wrap gap-2">
<!-- Active Chip -->
<button class="px-4 py-2 rounded-full border border-[#0E9F6E] bg-[#D9F5EA] text-[#0E9F6E] font-caption text-caption whitespace-nowrap transition-transform active:scale-95">
                    Large transfers
                </button>
<!-- Inactive Chips -->
<button class="px-4 py-2 rounded-full border border-border bg-surface text-text-secondary font-caption text-caption whitespace-nowrap transition-transform active:scale-95 hover:border-surface-container-high">
                    New mints
                </button>
<button class="px-4 py-2 rounded-full border border-border bg-surface text-text-secondary font-caption text-caption whitespace-nowrap transition-transform active:scale-95 hover:border-surface-container-high">
                    Whale moves
                </button>
</div>
</div>
<!-- Bottom Action Area -->
<div class="px-screen-padding pb-8 pt-4 bg-background relative z-10 flex flex-col items-center">
<!-- Page Indicator (Dots) -->
<div class="flex items-center justify-center gap-2 mb-8">
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
<div class="w-2 h-2 rounded-full bg-[#0E9F6E]"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Primary Action Button -->
<button class="w-full h-14 rounded-full bg-[#0E9F6E] text-white font-card-title text-card-title flex items-center justify-center transition-transform active:scale-95 shadow-md">
                Continue
            </button>

<div class="h-2 w-full mt-2"></div>
</div>
