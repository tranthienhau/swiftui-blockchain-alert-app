<style>
    body {
        background-color: #F6F8FB;
    }
    .soft-shadow {
        box-shadow: 0 2px 12px rgba(15, 23, 42, 0.06);
    }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="font-body-md text-text-primary antialiased min-h-screen pb-[84px]"> <!-- pb added to simulate bottom nav space if needed, though hidden here -->
<!-- TopAppBar -->
<header class="bg-background dark:bg-background w-full top-0 flex items-center justify-between px-screen-padding h-16 sticky z-50">
<button aria-label="Go back" class="text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 p-2 -ml-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary dark:text-primary-fixed-dim tracking-tight">ChainAlert</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<main class="px-screen-padding mt-stack-md flex flex-col gap-stack-lg max-w-md mx-auto">
<!-- Header Section -->
<div class="flex flex-col gap-stack-sm">
<h2 class="font-headline-lg text-headline-lg-mobile text-text-primary">Large ETH transfer</h2>
<div class="inline-flex items-center gap-2">
<span class="bg-[#D9F5EA] text-[#0E9F6E] font-caption text-caption px-3 py-1 rounded-full">Transfer &gt; $1M</span>
</div>
</div>
<!-- Hero Amount Card -->
<div class="bg-surface rounded-[16px] soft-shadow p-6 flex flex-col items-center justify-center text-center">
<span class="font-headline-lg text-headline-lg text-primary mb-1">$4.1M</span>
<span class="font-numeral-data text-numeral-data text-text-secondary">1,200 ETH</span>
</div>
<!-- Transaction Details Card -->
<div class="bg-surface rounded-[16px] soft-shadow flex flex-col">
<div class="p-4 flex items-center justify-between border-b border-border">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-low flex items-center justify-center">
<span class="material-symbols-outlined text-text-secondary text-sm" data-icon="arrow_upward">arrow_upward</span>
</div>
<div class="flex flex-col">
<span class="font-caption text-caption text-text-secondary">From</span>
<span class="font-body-md text-body-md font-medium text-text-primary">0x2b6...45f</span>
</div>
</div>
<button aria-label="Copy from address" class="text-text-secondary hover:text-primary transition-colors p-2">
<span class="material-symbols-outlined text-xl" data-icon="content_copy">content_copy</span>
</button>
</div>
<div class="p-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-low flex items-center justify-center">
<span class="material-symbols-outlined text-text-secondary text-sm" data-icon="arrow_downward">arrow_downward</span>
</div>
<div class="flex flex-col">
<span class="font-caption text-caption text-text-secondary">To</span>
<span class="font-body-md text-body-md font-medium text-text-primary">0x9a1...c72</span>
</div>
</div>
<button aria-label="Copy to address" class="text-text-secondary hover:text-primary transition-colors p-2">
<span class="material-symbols-outlined text-xl" data-icon="content_copy">content_copy</span>
</button>
</div>
</div>
<!-- Metadata Section -->
<div class="bg-surface rounded-[16px] soft-shadow p-4 flex flex-col gap-3">
<div class="flex justify-between items-center">
<span class="font-caption text-caption text-text-secondary">Block</span>
<span class="font-numeral-data text-numeral-data text-text-primary">#21,043,882</span>
</div>
<div class="h-px bg-border w-full"></div>
<div class="flex justify-between items-center">
<span class="font-caption text-caption text-text-secondary">Time</span>
<span class="font-body-md text-body-md text-text-primary">Aug 5 2026 04:31 UTC</span>
</div>
<div class="h-px bg-border w-full"></div>
<div class="flex justify-between items-center">
<span class="font-caption text-caption text-text-secondary">Gas</span>
<span class="font-numeral-data text-numeral-data text-text-primary">0.004 ETH</span>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-stack-md mt-4">
<button class="w-full bg-surface text-text-primary font-body-md text-body-md font-medium py-3 rounded-full border border-border hover:bg-surface-container-low transition-colors">
                View on Etherscan
            </button>
<button class="w-full text-negative font-body-md text-body-md font-medium py-3 hover:opacity-80 transition-opacity">
                Mute this entity
            </button>
</div>
</main>
</body></html>
