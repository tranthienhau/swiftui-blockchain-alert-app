<style>
        body {
            background-color: #F6F8FB; /* Required Background */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom soft shadow as requested */
        .soft-shadow {
            box-shadow: 0px 2px 12px rgba(15, 23, 42, 0.06);
        }

        /* Stacking animation for the cards */
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-card-1 { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; opacity: 0; }
        .animate-card-2 { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; opacity: 0; }
        .animate-card-3 { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards; opacity: 0; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center font-body-md text-text-primary">
<!-- Mobile Frame Container (Max width for typical phone size to enforce mobile UI) -->
<main class="w-full max-w-[390px] h-[844px] bg-background relative flex flex-col overflow-hidden shadow-2xl md:rounded-[40px] border border-border">
<!-- Header / Back button context -->
<header class="w-full flex justify-between items-center px-screen-padding pt-12 pb-4">
<button aria-label="Back" class="text-text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<button class="font-caption text-caption text-text-secondary active:scale-95 transition-transform">
                 Skip
             </button>
</header>
<!-- Content Area -->
<div class="flex-1 px-screen-padding flex flex-col mt-4">
<!-- Illustration / Stacked Cards -->
<div class="relative w-full h-[220px] mb-8 flex items-center justify-center">
<!-- Card 3 (Back) -->
<div class="absolute w-[240px] h-[64px] bg-surface rounded-xl soft-shadow animate-card-1 flex items-center px-4 gap-3 transform -translate-y-8 scale-90 border border-border opacity-60">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-text-secondary">
<span class="material-symbols-outlined text-[18px]">description</span>
</div>
<div>
<div class="font-caption text-caption text-text-primary">Uniswap V3</div>
<div class="text-[11px] text-text-secondary">Smart Contract</div>
</div>
</div>
<!-- Card 2 (Middle) -->
<div class="absolute w-[260px] h-[64px] bg-surface rounded-xl soft-shadow animate-card-2 flex items-center px-4 gap-3 transform -translate-y-4 scale-95 border border-border z-10 opacity-80">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-text-secondary">
<span class="material-symbols-outlined text-[18px]">paid</span>
</div>
<div>
<div class="font-caption text-caption text-text-primary">USDC</div>
<div class="text-[11px] text-text-secondary">Token Tracker</div>
</div>
</div>
<!-- Card 1 (Front) -->
<div class="absolute w-[280px] h-[72px] bg-surface rounded-xl soft-shadow animate-card-3 flex items-center px-4 gap-4 z-20 border border-primary/20">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<div class="flex-1">
<div class="font-card-title text-card-title text-text-primary">vitalik.eth</div>
<div class="font-caption text-caption text-text-secondary">Wallet Activity</div>
</div>
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
</div>
</div>
<!-- Copy -->
<div class="text-center mb-6 px-4">
<h1 class="font-headline-lg text-headline-lg text-text-primary mb-3">Track any wallet, token or contract</h1>
<p class="font-body-md text-body-md text-text-secondary">Monitor on-chain activity instantly. Get notified when significant movements occur.</p>
</div>
<!-- Interactive Chips -->
<div class="flex flex-wrap justify-center gap-2 mb-auto pb-8">
<button class="px-4 py-2 rounded-full bg-primary/10 border border-primary font-caption text-caption text-primary flex items-center gap-2 active:scale-95 transition-all">
<span class="w-2 h-2 rounded-full bg-primary"></span>
                    Vitalik.eth
                </button>
<button class="px-4 py-2 rounded-full bg-surface border border-border font-caption text-caption text-text-secondary active:scale-95 transition-all hover:bg-surface-container">
                    USDC
                </button>
<button class="px-4 py-2 rounded-full bg-surface border border-border font-caption text-caption text-text-secondary active:scale-95 transition-all hover:bg-surface-container">
                    Uniswap V3
                </button>
</div>
</div>
<!-- Bottom Controls -->
<div class="w-full px-screen-padding pb-10 flex flex-col items-center">
<!-- Pagination Dots -->
<div class="flex gap-2 mb-8">
<div class="w-2 h-2 rounded-full bg-surface-dim"></div>
<div class="w-6 h-2 rounded-full bg-primary transition-all duration-300"></div>
<div class="w-2 h-2 rounded-full bg-surface-dim"></div>
<div class="w-2 h-2 rounded-full bg-surface-dim"></div>
</div>
<!-- Continue Button -->
<button class="w-full py-4 rounded-full bg-primary font-card-title text-card-title text-white active:scale-[0.98] transition-transform shadow-[0_4px_14px_0_rgba(0,105,71,0.2)]">
                Continue
            </button>
</div>
</main>
<script>
        // Simple interactivity for the chips
        document.querySelectorAll('.flex-wrap button').forEach(button => {
            button.addEventListener('click', function() {
                // Reset all
                document.querySelectorAll('.flex-wrap button').forEach(btn => {
                    btn.className = 'px-4 py-2 rounded-full bg-surface border border-border font-caption text-caption text-text-secondary active:scale-95 transition-all hover:bg-surface-container';
                    const dot = btn.querySelector('span.w-2');
                    if(dot) dot.remove();
                });
                
                // Set active
                this.className = 'px-4 py-2 rounded-full bg-primary/10 border border-primary font-caption text-caption text-primary flex items-center gap-2 active:scale-95 transition-all';
                if(!this.querySelector('span.w-2')) {
                    const dot = document.createElement('span');
                    dot.className = 'w-2 h-2 rounded-full bg-primary';
                    this.prepend(dot);
                }
            });
        });
    </script>
</body></html>
